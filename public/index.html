<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seedscape</title>
  <meta name="description" content="Every Minecraft seed layer on one fast map, in 2D relief or 3D.">
  <meta name="author" content="Ishan Malu">
  <meta name="theme-color" content="#0b0d12">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Seedscape: Minecraft seed map, 3D terrain and seed finder">
  <meta property="og:description" content="Every structure and biome on one map, relief and 3D views, and a seed finder that runs in your browser.">
  <meta property="og:image" content="https://seedscape.vercel.app/og.jpg">
  <meta property="og:url" content="https://seedscape.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://seedscape.vercel.app/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239cf27a'/%3E%3Cstop offset='1' stop-color='%2354e0d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='5' y='5' width='14' height='14' rx='3.5' transform='rotate(45 12 12)' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js"
      }
    }
  </script>
</head>
<body>
  <main id="map">
    <canvas id="canvas"></canvas>
    <div id="view3d" hidden></div>
    <div id="tooltip" hidden></div>
  </main>

  <!-- Top-left: identity + seed -->
  <section class="glass" id="seedbar">
    <div class="brand"><span class="logo"></span>Seedscape
      <a class="credit" href="https://github.com/ishanmalu" target="_blank" rel="noopener" title="Ishan Malu on GitHub"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>Built by Ishan Malu</span></a>
      <a class="credit coffee" href="https://buymeacoffee.com/ishanmalu" target="_blank" rel="noopener" title="Support Seedscape: buy me a coffee" aria-label="Buy me a coffee"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2.5c-.6.8-.6 1.7 0 2.5M11.5 2.5c-.6.8-.6 1.7 0 2.5"/></svg><span>Buy me a coffee</span></a>
    </div>
    <div class="seed">
      <input id="seed" autocomplete="off" spellcheck="false" placeholder="Seed — number or text" aria-label="Seed">
      <select id="version" aria-label="Version">
        <option value="28">1.21.4</option>
        <option value="27">1.21.2–3</option>
        <option value="26">1.21–1.21.1</option>
        <option value="25">1.20</option>
        <option value="24">1.19.3–4</option>
        <option value="23">1.19–1.19.2</option>
        <option value="22">1.18</option>
        <option value="bedrock">Bedrock (biomes)</option>
      </select>
      <button id="save-seed" class="ghost" title="Save this seed" aria-label="Save this seed" aria-pressed="false"></button>
      <button id="random" class="ghost" title="Random seed" aria-label="Random seed">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
      </button>
    </div>
    <div class="glass menu" id="saved-menu" hidden>
      <div class="saved-head">Saved seeds</div>
      <ol id="saved-list"></ol>
    </div>
    <div class="chips">
      <div class="seg" id="dims" role="radiogroup" aria-label="Dimension">
        <button role="radio" data-dim="0" class="on">Overworld</button>
        <button role="radio" data-dim="-1">Nether</button>
        <button role="radio" data-dim="1">End</button>
      </div>
    </div>
  </section>

  <!-- Left: layers -->
  <section class="glass" id="layers-card">
    <button class="card-head" id="layers-toggle" aria-controls="layers" aria-expanded="true">
      <span>Layers</span>
      <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="card-body">
      <div id="view-opts"></div>
      <div id="layers"></div>
      <div class="group legend-head">Biomes in view <small>click to find nearest</small></div>
      <ol id="legend"></ol>
    </div>
  </section>

  <!-- Top-right: view mode + share -->
  <section class="glass" id="modebar">
    <div class="seg" id="modes" role="radiogroup" aria-label="View">
      <button role="radio" data-mode="map">Map</button>
      <button role="radio" data-mode="relief" class="on">Relief</button>
      <button role="radio" data-mode="3d">3D</button>
    </div>
    <button id="cmd-open" class="ghost with-icon" title="Command palette (⌘K)" aria-label="Command palette"><kbd>⌘K</kbd></button>
    <button id="open-finder" class="ghost with-icon" aria-expanded="false" aria-controls="finder">Find seeds</button>
    <div class="menu-wrap">
      <button id="share" class="primary" aria-haspopup="menu" aria-expanded="false" aria-controls="share-menu">Share</button>
      <div class="glass menu" id="share-menu" role="menu" hidden>
        <button role="menuitem" data-a="link">Copy link</button>
        <button role="menuitem" data-a="embed">Copy embed code</button>
        <button role="menuitem" data-a="png">Save PNG of this view</button>
        <button role="menuitem" data-a="poster">Save 4K poster</button>
        <button role="menuitem" data-a="compare">Compare with another seed</button>
      </div>
    </div>
  </section>

  <!-- Right: nearby -->
  <section class="glass" id="nearby-card">
    <div class="card-head static"><span>Nearby</span></div>
    <form id="goto">
      <input id="goto-x" inputmode="numeric" placeholder="X" aria-label="X">
      <input id="goto-z" inputmode="numeric" placeholder="Z" aria-label="Z">
      <button type="submit" class="ghost">Go</button>
      <button type="button" id="add-pin" class="ghost" title="Pin these coordinates" aria-label="Pin these coordinates"></button>
    </form>
    <div class="locate">
      <select id="locate-biome" aria-label="Biome to find"><option value="">Find nearest biome…</option></select>
    </div>
    <div class="wp-head" id="wp-head" hidden>
      <span>Pins</span>
      <button class="text-btn" id="wp-export" title="Download all pins as a Seedscape file">JSON</button>
      <button class="text-btn" id="wp-xaero" title="Download this dimension's pins for Xaero's Minimap">Xaero</button>
      <button class="icon-btn" id="wp-import" title="Import a Seedscape or Xaero file" aria-label="Import pins"></button>
      <input type="file" id="wp-file" accept=".json,.txt" hidden>
    </div>
    <ol id="waypoints" aria-label="Waypoints"></ol>
    <ol id="nearby"></ol>
  </section>

  <!-- Right: seed finder (replaces Nearby while open) -->
  <section class="glass" id="finder" hidden>
    <div class="card-head static">
      <span>Seed finder</span>
      <button id="close-finder" class="icon-btn" aria-label="Close finder"></button>
    </div>
    <div class="finder-body">
      <label class="lede">Distances from
        <select id="find-from" aria-label="Measure distances from">
          <option value="origin">0, 0</option>
          <option value="spawn">world spawn</option>
        </select>
      </label>
      <div id="conds"></div>
      <button id="add-cond" class="ghost add-cond"></button>
      <label class="start">
        <span>Start from</span>
        <input id="find-start" autocomplete="off" spellcheck="false" placeholder="Random">
      </label>
      <button id="find-run" class="primary run">Search</button>
      <div id="find-stats" aria-live="polite"></div>
      <ol id="find-results"></ol>
    </div>
  </section>

  <!-- Bottom -->
  <div class="glass pill" id="status">
    <span id="coords">0, 0</span>
    <span class="dot"></span>
    <span id="biome">—</span>
    <span id="busy" hidden><i class="spinner"></i></span>
  </div>
  <div class="glass" id="zoom">
    <button id="zoom-in" class="ghost" aria-label="Zoom in">+</button>
    <button id="zoom-out" class="ghost" aria-label="Zoom out">−</button>
    <span class="sep"></span>
    <button id="tool-ruler" class="ghost"></button>
    <button id="tool-portal" class="ghost"></button>
  </div>
  <div class="glass pill" id="toast" role="status" hidden></div>
  <a class="glass pill" id="open-full" target="_blank" rel="noopener">Open in Seedscape </a>
  <div class="glass" id="details" hidden></div>
  <div class="glass" id="toolbar3d" hidden>
    <div class="seg" id="sizes" role="radiogroup" aria-label="3D area">
      <button role="radio" data-s="4">800</button>
      <button role="radio" data-s="8">1.6k</button>
      <button role="radio" data-s="16">3.2k</button>
    </div>
    <button id="coords-toggle" class="ghost with-icon on" aria-pressed="true">Coordinates</button>
  </div>
  <div class="glass pill" id="readout" hidden></div>
  <div class="glass pill" id="hint3d" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
