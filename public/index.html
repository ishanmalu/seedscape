<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seedscape</title>
  <meta name="description" content="Every Minecraft seed layer on one fast map, in 2D relief or 3D.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239cf27a'/%3E%3Cstop offset='1' stop-color='%2354e0d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='5' y='5' width='14' height='14' rx='3.5' transform='rotate(45 12 12)' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js"
      }
    }
  </script>
</head>
<body>
  <main id="map">
    <canvas id="canvas"></canvas>
    <div id="view3d" hidden></div>
    <div id="tooltip" hidden></div>
  </main>

  <!-- Top-left: identity + seed -->
  <section class="glass" id="seedbar">
    <div class="brand"><span class="logo"></span>Seedscape</div>
    <div class="seed">
      <input id="seed" autocomplete="off" spellcheck="false" placeholder="Seed — number or text" aria-label="Seed">
      <select id="version" aria-label="Version">
        <option value="28">1.21.4</option>
        <option value="27">1.21.2–3</option>
        <option value="26">1.21–1.21.1</option>
        <option value="25">1.20</option>
        <option value="24">1.19.3–4</option>
        <option value="23">1.19–1.19.2</option>
        <option value="22">1.18</option>
      </select>
      <button id="random" class="ghost" title="Random seed" aria-label="Random seed">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
      </button>
    </div>
    <div class="chips">
      <div class="seg" id="dims" role="radiogroup" aria-label="Dimension">
        <button role="radio" data-dim="0" class="on">Overworld</button>
        <button role="radio" data-dim="-1">Nether</button>
        <button role="radio" data-dim="1">End</button>
      </div>
    </div>
  </section>

  <!-- Left: layers -->
  <section class="glass" id="layers-card">
    <button class="card-head" id="layers-toggle" aria-controls="layers" aria-expanded="true">
      <span>Layers</span>
      <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="card-body" id="layers"></div>
  </section>

  <!-- Top-right: view mode + share -->
  <section class="glass" id="modebar">
    <div class="seg" id="modes" role="radiogroup" aria-label="View">
      <button role="radio" data-mode="map">Map</button>
      <button role="radio" data-mode="relief" class="on">Relief</button>
      <button role="radio" data-mode="3d">3D</button>
    </div>
    <button id="open-finder" class="ghost with-icon" aria-expanded="false" aria-controls="finder">Find seeds</button>
    <button id="share" class="primary">Share</button>
  </section>

  <!-- Right: nearby -->
  <section class="glass" id="nearby-card">
    <div class="card-head static"><span>Nearby</span></div>
    <form id="goto">
      <input id="goto-x" inputmode="numeric" placeholder="X" aria-label="X">
      <input id="goto-z" inputmode="numeric" placeholder="Z" aria-label="Z">
      <button type="submit" class="ghost">Go</button>
      <button type="button" id="add-pin" class="ghost" title="Pin these coordinates" aria-label="Pin these coordinates"></button>
    </form>
    <ol id="waypoints" aria-label="Waypoints"></ol>
    <ol id="nearby"></ol>
  </section>

  <!-- Right: seed finder (replaces Nearby while open) -->
  <section class="glass" id="finder" hidden>
    <div class="card-head static">
      <span>Seed finder</span>
      <button id="close-finder" class="icon-btn" aria-label="Close finder"></button>
    </div>
    <div class="finder-body">
      <p class="lede">Seeds where every condition is within range of 0, 0.</p>
      <div id="conds"></div>
      <button id="add-cond" class="ghost add-cond"></button>
      <label class="start">
        <span>Start from</span>
        <input id="find-start" autocomplete="off" spellcheck="false" placeholder="Random">
      </label>
      <button id="find-run" class="primary run">Search</button>
      <div id="find-stats" aria-live="polite"></div>
      <ol id="find-results"></ol>
    </div>
  </section>

  <!-- Bottom -->
  <div class="glass pill" id="status">
    <span id="coords">0, 0</span>
    <span class="dot"></span>
    <span id="biome">—</span>
    <span id="busy" hidden><i class="spinner"></i></span>
  </div>
  <div class="glass" id="zoom">
    <button id="zoom-in" class="ghost" aria-label="Zoom in">+</button>
    <button id="zoom-out" class="ghost" aria-label="Zoom out">−</button>
  </div>
  <div class="glass" id="toolbar3d" hidden>
    <div class="seg" id="sizes" role="radiogroup" aria-label="3D area">
      <button role="radio" data-s="4">800</button>
      <button role="radio" data-s="8">1.6k</button>
      <button role="radio" data-s="16">3.2k</button>
    </div>
    <button id="coords-toggle" class="ghost with-icon on" aria-pressed="true">Coordinates</button>
  </div>
  <div class="glass pill" id="readout" hidden></div>
  <div class="glass pill" id="hint3d" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
